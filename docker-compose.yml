services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GRAPH_NAME: lasthop
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      LASTHOP_ADMIN_KEY: ${LASTHOP_ADMIN_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${LASTHOP_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
volumes:
  graph-data:
