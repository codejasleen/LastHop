services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GRAPH_NAME: blastradius
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      BLASTRADIUS_ADMIN_KEY: ${BLASTRADIUS_ADMIN_KEY:-}
    ports:
      - "${BLASTRADIUS_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
volumes:
  graph-data:
